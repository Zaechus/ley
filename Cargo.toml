[package]
name = "ley"
version = "0.1.0"
edition = "2024"
description = "A simple game launcher"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
lzma-rust2 = "0.25"
openssl = { version = "*", features = ["vendored"] }
reqwest = { version = "0.13", features = ["blocking"] }
sysinfo = "0.40"
tar = "0.4"
toml = "1.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
